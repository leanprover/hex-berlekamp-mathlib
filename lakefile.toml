name = "hex-berlekamp-mathlib"
defaultTargets = ["HexBerlekampMathlib", "HexBerlekampMathlibTests"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexBerlekamp"
git = "https://github.com/leanprover/hex-berlekamp.git"
rev = "b0a24af3b8b0a42f6ddd8b96f77eaf9eb8955875"

[[require]]
name = "HexPolyMathlib"
git = "https://github.com/leanprover/hex-poly-mathlib.git"
rev = "d4bbb82b87704d3016c6c1d822ae1f77c793958a"

[[require]]
name = "HexModArithMathlib"
git = "https://github.com/leanprover/hex-mod-arith-mathlib.git"
rev = "5aa0aa69b47c153189d708c3047aa294a594113f"

[[require]]
name = "HexPolyFpMathlib"
git = "https://github.com/leanprover/hex-poly-fp-mathlib.git"
rev = "c4f4cc93006daf0f41013fb072d91327b9c42f09"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.0-rc2"

[[lean_lib]]
name = "HexBerlekampMathlib"

[[lean_lib]]
name = "HexBerlekampMathlibTests"
globs = ["HexBerlekampMathlib.FactorPolyTests"]
